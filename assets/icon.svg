<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Inkframe app icon</title>
  <desc id="desc">An ivory typeset page held inside a dark ink frame with a cyan registration mark.</desc>
  <defs>
    <linearGradient id="shell" x1="180" y1="118" x2="824" y2="906" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#243844"/>
      <stop offset="0.55" stop-color="#14242d"/>
      <stop offset="1" stop-color="#0a151c"/>
    </linearGradient>
    <linearGradient id="rim" x1="222" y1="158" x2="785" y2="865" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39515e"/>
      <stop offset="1" stop-color="#142630"/>
    </linearGradient>
    <linearGradient id="paper" x1="379" y1="246" x2="654" y2="810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffefa"/>
      <stop offset="1" stop-color="#eee9dd"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67d7e6"/>
      <stop offset="1" stop-color="#2897b9"/>
    </linearGradient>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="32" flood-color="#02070a" flood-opacity="0.48"/>
    </filter>
    <filter id="paperShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02080c" flood-opacity="0.42"/>
    </filter>
  </defs>

  <g filter="url(#outerShadow)">
    <rect x="72" y="72" width="880" height="880" rx="208" fill="#172a34"/>
    <rect x="91" y="91" width="842" height="842" rx="190" fill="none" stroke="#ffffff" stroke-opacity="0.075" stroke-width="3"/>
    <path d="M252 192H772C805 192 832 219 832 252V772C832 805 805 832 772 832H252C219 832 192 805 192 772V252C192 219 219 192 252 192Z" fill="#0d1c24" stroke="#344b57" stroke-width="28"/>
  </g>

  <g filter="url(#paperShadow)">
    <path d="M350 218H634L714 298V806H350V218Z" fill="#f6f2e8"/>
    <path d="M634 218V298H714" fill="#d8d4ca"/>
    <path d="M634 218L714 298H650C641 298 634 291 634 282V218Z" fill="#e5e1d7"/>
    <path d="M350 218H634L714 298V806H350V218Z" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="5"/>
  </g>

  <g fill="#20323b">
    <rect x="411" y="370" width="242" height="22" rx="11"/>
    <rect x="411" y="436" width="190" height="15" rx="7.5" opacity="0.82"/>
    <rect x="411" y="477" width="242" height="15" rx="7.5" opacity="0.82"/>
    <rect x="411" y="518" width="218" height="15" rx="7.5" opacity="0.82"/>
    <rect x="411" y="594" width="242" height="11" rx="5.5" opacity="0.42"/>
    <rect x="411" y="628" width="222" height="11" rx="5.5" opacity="0.42"/>
    <rect x="411" y="662" width="235" height="11" rx="5.5" opacity="0.42"/>
  </g>

  <rect x="326" y="318" width="16" height="72" rx="8" fill="#65d4e2"/>
  <rect x="722" y="650" width="16" height="72" rx="8" fill="#2ba0bf"/>
